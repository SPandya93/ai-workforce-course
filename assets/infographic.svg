<svg xmlns="http://www.w3.org/2000/svg" width="620" height="800" viewBox="0 0 620 800"><rect width="620" height="800" fill="#f8f5ee"/><text x="45" y="62" fill="#5e7080" font-family="sans-serif" font-size="11" letter-spacing="2">ILLUSTRATIVE TRAINING RESOURCE</text><text x="45" y="130" fill="#123b65" font-family="sans-serif" font-weight="700" font-size="40">Before you</text><text x="45" y="181" fill="#123b65" font-family="sans-serif" font-weight="700" font-size="40">share it.</text><path d="M45 210h95" stroke="#a98a49" stroke-width="4"/><g font-family="sans-serif"><circle cx="79" cy="293" r="29" fill="#153e67"/><text x="69" y="302" fill="#fff" font-size="25">1</text><text x="134" y="288" fill="#173c62" font-size="23" font-weight="700">Check the facts.</text><text x="134" y="319" fill="#607380" font-size="15">Can you verify the key claims?</text><circle cx="79" cy="410" r="29" fill="#467b8f"/><text x="69" y="419" fill="#fff" font-size="25">2</text><text x="134" y="405" fill="#173c62" font-size="23" font-weight="700">Look for bias.</text><text x="134" y="436" fill="#607380" font-size="15">Whose perspective is missing?</text><circle cx="79" cy="527" r="29" fill="#a08245"/><text x="69" y="536" fill="#fff" font-size="25">3</text><text x="134" y="522" fill="#173c62" font-size="23" font-weight="700">Protect privacy.</text><text x="134" y="553" fill="#607380" font-size="15">Remove sensitive information.</text><circle cx="79" cy="644" r="29" fill="#4f6d55"/><text x="69" y="653" fill="#fff" font-size="25">4</text><text x="134" y="639" fill="#173c62" font-size="23" font-weight="700">Own the result.</text><text x="134" y="670" fill="#607380" font-size="15">Explain your choices and AI use.</text></g><rect y="745" width="620" height="55" fill="#153e67"/><text x="310" y="778" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" letter-spacing="2">YOUR JUDGMENT IS PART OF THE PROCESS</text></svg>
